<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title{font-size:22px;font-weight:bold;fill:#111}
    .subtitle{font-size:14px;fill:#444}
    .label{font-size:13px;fill:#222}
    .small{font-size:12px;fill:#333}
    .muted{font-size:12px;fill:#666}
    .btn{font-size:13px;font-weight:bold;fill:#fff}
    .link{font-size:12px;fill:#2457b2}
    .header{fill:#f5f5f5;stroke:#999}
    .box{fill:#fff;stroke:#888}
    .input{fill:#fff;stroke:#999}
    .btn-fill{fill:#2f6fed;stroke:#2457b2}
    .alert{fill:#fdecea;stroke:#d93025}
    .ok{fill:#e7f7ee;stroke:#1a7f37}
  </style>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="30" y="40" class="title">T03 — Cadastro (cadastro.php)</text>
  <text x="30" y="62" class="subtitle">Público | Livre (redireciona se já logado) | Objetivo: criar conta de viajante (F1)</text>

  <!-- Mobile -->
  <text x="30" y="100" class="label" font-weight="bold">Mobile (validação/erro, nome e e-mail preservados)</text>
  <rect x="30" y="115" width="340" height="550" rx="18" class="box"/>
  <rect x="30" y="115" width="340" height="50" rx="18" class="header"/>
  <rect x="30" y="147" width="340" height="18" fill="#f5f5f5"/>
  <text x="50" y="146" class="label">≡  HotelReserva</text>

  <text x="55" y="200" class="label" font-weight="bold" font-size="18">Criar conta</text>
  <rect x="55" y="215" width="290" height="40" rx="6" class="alert"/>
  <text x="70" y="240" class="small" font-weight="bold">! Este e-mail já está cadastrado.</text>

  <text x="55" y="280" class="small">Nome *</text>
  <rect x="55" y="288" width="290" height="34" rx="4" class="input"/>
  <text x="68" y="310" class="small">Maria Silva</text>
  <text x="55" y="342" class="small">E-mail *</text>
  <rect x="55" y="350" width="290" height="34" rx="4" class="input"/>
  <text x="68" y="372" class="small">maria@email.com</text>
  <text x="55" y="404" class="small">Senha *</text>
  <rect x="55" y="412" width="290" height="34" rx="4" class="input"/>
  <text x="68" y="434" class="muted">••••••••</text>
  <text x="55" y="466" class="small">Confirmar senha *</text>
  <rect x="55" y="474" width="290" height="34" rx="4" class="input"/>
  <text x="68" y="496" class="muted">••••••••</text>

  <rect x="55" y="530" width="290" height="42" rx="6" class="btn-fill"/>
  <text x="145" y="556" class="btn">CADASTRAR</text>
  <text x="55" y="598" class="small">Já tenho conta?</text>
  <text x="155" y="598" class="link">Entrar</text>
  <text x="55" y="625" class="muted">Carregando: "Cadastrando..." (desabilitado)</text>

  <!-- Messages and success -->
  <text x="420" y="100" class="label" font-weight="bold">Mensagens e sucesso</text>
  <rect x="420" y="115" width="540" height="170" rx="6" class="box"/>
  <text x="440" y="140" class="small" font-weight="bold">Validações:</text>
  <text x="440" y="160" class="small">• "Informe seu nome."  • "Informe um e-mail válido."</text>
  <text x="440" y="178" class="small">• "Informe uma senha."  • "As senhas não coincidem."</text>
  <text x="440" y="205" class="small" font-weight="bold">Erros:</text>
  <text x="440" y="223" class="small">• "Este e-mail já está cadastrado."</text>
  <text x="440" y="241" class="small">• "Não foi possível concluir o cadastro. Tente novamente."</text>
  <text x="440" y="268" class="small" font-weight="bold">Preservar em erro:</text>
  <text x="560" y="268" class="small">nome e e-mail (não preservar senhas)</text>

  <rect x="420" y="300" width="540" height="85" rx="6" class="ok"/>
  <text x="440" y="328" class="small" font-weight="bold">✓ Sucesso</text>
  <text x="440" y="348" class="small">"Cadastro realizado com sucesso. Faça login para continuar."</text>
  <text x="440" y="368" class="small">→ Redireciona para T02 (ou login automático → T01, conforme implementação)</text>

  <!-- Desktop -->
  <text x="420" y="420" class="label" font-weight="bold">Desktop</text>
  <rect x="420" y="435" width="540" height="230" rx="8" class="box"/>
  <rect x="420" y="435" width="540" height="40" class="header"/>
  <text x="440" y="460" class="label">HotelReserva   Buscar</text>
  <text x="885" y="460" class="small">[Entrar]</text>
  <rect x="555" y="490" width="270" height="160" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="640" y="515" class="label" font-weight="bold">Criar conta</text>
  <text x="575" y="535" class="muted">Nome, E-mail, Senha, Confirmar senha</text>
  <rect x="575" y="548" width="230" height="28" rx="4" class="btn-fill"/>
  <text x="650" y="567" class="btn">CADASTRAR</text>
  <text x="615" y="590" class="small">Já tenho conta?</text>
  <text x="710" y="590" class="link">Entrar</text>
  <text x="575" y="630" class="muted">Campos empilhados em coluna, largura centralizada.</text>
</svg>
